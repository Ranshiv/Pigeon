<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Environment Selector Theme Demo</title>
    <link rel="stylesheet" href="EnvironmentSelector.css" />
    <style>
      body {
        margin: 0;
        padding: 40px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          sans-serif;
        transition: all 0.3s ease;
      }

      /* Light theme body */
      body {
        background: #f8fafc;
        color: #374151;
      }

      /* Dark theme body */
      body[data-theme="dark"] {
        background: #0f172a;
        color: #f1f5f9;
      }

      .demo-container {
        max-width: 800px;
        margin: 0 auto;
      }

      .theme-toggle {
        margin-bottom: 30px;
        text-align: center;
      }

      .theme-toggle button {
        background: var(--env-bg-primary);
        border: 1px solid var(--env-border-primary);
        border-radius: 8px;
        padding: 8px 16px;
        margin: 0 8px;
        cursor: pointer;
        color: var(--env-text-primary);
        transition: all 0.15s ease;
      }

      .theme-toggle button:hover {
        background: var(--env-bg-hover);
        border-color: var(--env-border-hover);
      }

      .theme-toggle button.active {
        background: var(--env-bg-selected);
        border-color: var(--env-border-accent);
        color: var(--env-text-accent);
      }

      .demo-section {
        margin-bottom: 40px;
        padding: 20px;
        background: var(--env-bg-primary);
        border: 1px solid var(--env-border-primary);
        border-radius: 12px;
        box-shadow: 0 2px 8px var(--env-shadow-light);
      }

      .demo-section h3 {
        margin-top: 0;
        color: var(--env-text-primary);
      }

      .environment-dropdown.is-open .environment-dropdown-menu {
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="demo-container">
      <div class="theme-toggle">
        <h2>Environment Selector Theme Demo</h2>
        <button onclick="setTheme('light')" class="active" id="light-btn">
          Light Theme
        </button>
        <button onclick="setTheme('dark')" id="dark-btn">Dark Theme</button>
      </div>

      <div class="demo-section">
        <h3>Environment Selector - Closed State</h3>
        <div class="environment-selector">
          <div class="environment-dropdown">
            <button class="environment-button" aria-expanded="false">
              <span class="environment-label">Production Environment</span>
              <span class="environment-arrow">▼</span>
            </button>
          </div>
        </div>
      </div>

      <div class="demo-section">
        <h3>Environment Selector - Open State</h3>
        <div class="environment-selector">
          <div class="environment-dropdown is-open">
            <button class="environment-button" aria-expanded="true">
              <span class="environment-label">Production Environment</span>
              <span class="environment-arrow">▼</span>
            </button>
            <div class="environment-dropdown-menu">
              <div class="environment-header">
                <span>Environments</span>
                <button class="manage-btn">Manage</button>
              </div>
              <div class="environment-list">
                <div class="environment-option">
                  <div class="environment-info">
                    <span class="environment-name">No Environment</span>
                  </div>
                </div>
                <div class="environment-option selected">
                  <div class="environment-info">
                    <span class="environment-name">Production Environment</span>
                    <span class="default-badge">Default</span>
                  </div>
                  <span class="check-icon">✓</span>
                </div>
                <div class="environment-option">
                  <div class="environment-info">
                    <span class="environment-name"
                      >Development Environment</span
                    >
                  </div>
                </div>
                <div class="environment-option">
                  <div class="environment-info">
                    <span class="environment-name">Staging Environment</span>
                  </div>
                </div>
              </div>
              <div class="environment-footer">
                <button class="create-environment-btn">
                  <span>+ Create New Environment</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      function setTheme(theme) {
        // Update body data-theme attribute
        if (theme === "dark") {
          document.body.setAttribute("data-theme", "dark");
          document.getElementById("dark-btn").classList.add("active");
          document.getElementById("light-btn").classList.remove("active");
        } else {
          document.body.removeAttribute("data-theme");
          document.getElementById("light-btn").classList.add("active");
          document.getElementById("dark-btn").classList.remove("active");
        }
      }

      // Add hover effects to environment options
      document.querySelectorAll(".environment-option").forEach((option) => {
        option.addEventListener("click", function () {
          document.querySelectorAll(".environment-option").forEach((opt) => {
            opt.classList.remove("selected");
            opt.querySelector(".check-icon")?.remove();
          });

          this.classList.add("selected");
          if (!this.querySelector(".check-icon")) {
            const checkIcon = document.createElement("span");
            checkIcon.className = "check-icon";
            checkIcon.textContent = "✓";
            this.appendChild(checkIcon);
          }
        });
      });
    </script>
  </body>
</html>
