<!DOCTYPE html>
<html>
<head>
    <style>
        .btn-test {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #014C75;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            padding: 12px 28px;
            margin-top: 18px;
            box-shadow: 0 2px 8px rgba(1, 76, 117, 0.2);
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1; /* Reset line-height to ensure pure flex centering */
        }
        
        .btn-test svg {
            /* Fix SVG alignment inside flex container */
            display: block; 
            margin: 0;
            line-height: 1;
        }
        
        .container {
            padding: 50px;
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn-test">
            <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg> 
            Create Variable
        </button>
    </div>
</body>
</html>
