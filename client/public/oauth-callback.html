<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OAuth Callback - Pigeon</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto",
          sans-serif;
        margin: 0;
        padding: 40px;
        background: #1e1e1e;
        color: #e6e6e6;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .container {
        text-align: center;
        max-width: 500px;
      }
      .logo {
        font-size: 24px;
        font-weight: 600;
        color: #ff6c37;
        margin-bottom: 20px;
      }
      .status {
        margin: 20px 0;
        padding: 16px;
        border-radius: 8px;
        font-size: 16px;
      }
      .success {
        background: rgba(34, 197, 94, 0.1);
        border: 1px solid #22c55e;
        color: #22c55e;
      }
      .error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid #ef4444;
        color: #ef4444;
      }
      .loading {
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid #3b82f6;
        color: #3b82f6;
      }
      .details {
        margin-top: 16px;
        font-size: 14px;
        color: #a0a0a0;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="logo">🐦 Pigeon</div>
      <div id="status" class="status loading">Processing OAuth callback...</div>
      <div id="details" class="details"></div>
    </div>

    <script>
      (function () {
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get("code");
        const state = urlParams.get("state");
        const error = urlParams.get("error");
        const errorDescription = urlParams.get("error_description");

        const statusEl = document.getElementById("status");
        const detailsEl = document.getElementById("details");

        if (error) {
          statusEl.className = "status error";
          statusEl.textContent = "OAuth Authorization Failed";
          detailsEl.textContent = `Error: ${error}${
            errorDescription ? ` - ${errorDescription}` : ""
          }`;

          // Send error to parent window
          if (window.opener) {
            window.opener.postMessage(
              {
                type: "OAUTH_CALLBACK",
                error: error,
                error_description: errorDescription,
              },
              window.location.origin
            );
            window.close();
          }
          return;
        }

        if (code && state) {
          statusEl.className = "status success";
          statusEl.textContent = "Authorization Successful!";
          detailsEl.textContent = "Redirecting back to Pigeon...";

          // Send success to parent window
          if (window.opener) {
            window.opener.postMessage(
              {
                type: "OAUTH_CALLBACK",
                code: code,
                state: state,
              },
              window.location.origin
            );

            setTimeout(() => {
              window.close();
            }, 1000);
          } else {
            // If no parent window, redirect to main app
            setTimeout(() => {
              window.location.href = "/";
            }, 2000);
          }
        } else {
          statusEl.className = "status error";
          statusEl.textContent = "Invalid OAuth Response";
          detailsEl.textContent =
            "Missing authorization code or state parameter.";
        }
      })();
    </script>
  </body>
</html>
